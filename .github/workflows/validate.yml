name: Validate dashboard plugin
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and run card tests
        run: |
          node --check dist/infuse-dashboard-cards.js
          node --check examples/www/infuse-now-playing-card.js
          node --check examples/www/infuse-household-card.js
          node --test tests/test_now_playing_card.mjs
          cat examples/www/infuse-now-playing-card.js examples/www/infuse-household-card.js | cmp - dist/infuse-dashboard-cards.js
  marketplace:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: plugin
