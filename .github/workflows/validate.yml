name: Validate dashboard plugin
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and run card tests
        run: |
          node --check dist/infuse-dashboard-cards.js
          node --check examples/www/infuse-now-playing-card.js
          node --check examples/www/infuse-household-card.js
          node --test tests/test_now_playing_card.mjs tests/test_household_card.mjs
          python3 scripts/build-migration-bridge.py --check
          node --test tests/test_migration_bridge.mjs
      - name: Check real-card preview gallery assets
        run: |
          test -s assets/previews/single-device.png
          test -s assets/previews/multiple-devices.png
          test -s tests/preview-fixture.html
          grep -Fq 'src="https://raw.githubusercontent.com/Manantra/ha-infuse-cards/main/assets/previews/single-device.png"' README.md
          grep -Fq 'src="https://raw.githubusercontent.com/Manantra/ha-infuse-cards/main/assets/previews/multiple-devices.png"' README.md
  marketplace:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: plugin
